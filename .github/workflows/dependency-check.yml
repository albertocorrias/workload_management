name: Dependency Drift Check

on:
  pull_request:
    paths:
      - 'requirements.in'
      - 'requirements-dev.in'
      - 'requirements.txt'
      - 'requirements-dev.txt'

jobs:
  verify-dependencies:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.12' # same as CI
          cache: 'pip'

      - name: Install pip-tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-tools

      - name: Re-compile Requirements
        run: |
          pip-compile requirements.in
          pip-compile requirements-dev.in

      - name: Check for Changes (Drift)
        run: |
          if ! git diff --exit-code; then
            echo "::error::Compiled requirement files do not match the .in source files!"
            echo "::notice::Please run 'pip-compile requirements.in' and 'pip-compile requirements-dev.in' locally, then commit the updated .txt files."
            exit 1
          fi

